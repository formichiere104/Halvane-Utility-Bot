# Bot settings. Not secret: safe to commit. The token lives in .env.

guild_id: "1569664645109907456"   # Halvane Corporation

database: data/halvane.db          # SQLite, created on first run
embeds_dir: embeds                 # one YAML file per managed message set
ids_file: config/ids.yaml          # role and channel ids, generated by `python -m halvane_bot export-ids`

# Role keys (from ids.yaml) allowed to use /embeds. Server owners can always use it.
embed_managers:
  - director
  - deputy_director
  - associate_deputy_director
  - assistant_director

# Roblox side (phase 2). The game is the NPC test place for now; change these when the real place exists.
roblox:
  group_id: 467115756          # the Staff Register
  universe_id: 10775400484     # NPC System Testing (place 88799018873683)
role_map_file: config/role_map.yaml

# Account linking. Must match the game's Staff Register terminal
# (NPC-Framework: ServerScriptService/NPC_Lab/StaffRegister/LinkCode.luau and LinkCodeStore.luau):
# the game writes data store <data_store>, key = code, value = { userId, at } (at = os.time()).
link_codes:
  data_store: LinkCodes
  alphabet: ABCDEFGHJKLMNPQRSTUVWXYZ23456789   # no 0/O, no 1/I
  length: 6
  expires_minutes: 10

# Role sync (phase 2). Role keys allowed to use /sync; the server owner always can.
sync_managers:
  - director
  - deputy_director
  - associate_deputy_director
  - assistant_director
sync_interval_minutes: 15        # sweep of every linked member
nickname_format: "{username}"    # Roblox username as the Discord nickname; empty = leave nicknames alone

# Channel key where the bot logs what it published. Leave empty to disable.
log_channel: server_logs

# Links used in embeds as {link:key}. An empty link blocks publishing until it is filled in.
links:
  roblox_group: "https://www.roblox.com/communities/467115756/Forklift-Certification-Program#!/about"   # the Staff Register, e.g. https://www.roblox.com/communities/<id>
  game: "https://www.roblox.com/games/88799018873683/NPC-System-Testing"           # the experience page
