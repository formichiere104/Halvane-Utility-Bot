# Bot settings. Not secret: safe to commit. The token lives in .env.

guild_id: "1569664645109907456"   # Halvane Corporation

database: data/halvane.db          # SQLite, created on first run
embeds_dir: embeds                 # one YAML file per managed message set
ids_file: config/ids.yaml          # role and channel ids, generated by `python -m halvane_bot export-ids`

# Role keys (from ids.yaml) allowed to use /embeds. Server owners can always use it.
embed_managers:
  - director
  - deputy_director
  - associate_deputy_director
  - assistant_director

# Channel key where the bot logs what it published. Leave empty to disable.
log_channel: server_logs

# Links used in embeds as {link:key}. An empty link blocks publishing until it is filled in.
links:
  roblox_group: "https://www.roblox.com/communities/467115756/Forklift-Certification-Program#!/about"   # the Staff Register, e.g. https://www.roblox.com/communities/<id>
  game: "https://www.roblox.com/games/88799018873683/NPC-System-Testing"           # the experience page
