channel: welcome
note: First thing new members read.
messages:
  - embeds:
      - title: Halvane Corporation
        color: "#4F8FD6"
        description: |
          *Discretion. Delivery. Duty.*

          Welcome to the Recruitment Office. Every branch of Halvane runs on its staff, and every staff member starts the same way.

          **1.** Play the game and file Form HC-1 at the Intake Tray in the Lobby: {link:game}
          **2.** Join the Staff Register, our Roblox group: {link:roblox_group}
          **3.** Verify your Roblox account in {channel:verify}.
          **4.** Read {channel:ranks_explained}, then choose your notices in Channels & Roles.

          Questions go to {channel:faq} first, then to a ticket in {channel:open_a_ticket}.
