channel: rules
note: Server rules (Staff Conduct).
messages:
  - embeds:
      - title: Halvane Staff Conduct
        color: "#B03A3A"
        description: |
          **1. Respect.** No harassment, hate speech, slurs or targeted abuse.
          **2. Platform rules.** Follow Discord's Terms of Service and Community Guidelines, and Roblox's Community Standards.
          **3. Right channel.** No spam, mass mentions or advertising.
          **4. Rank is roleplay.** Rank gives authority in game and in division channels, it holds no exemption from the rules.
          **5. No exploits.** Don't use them or share them. Report them privately with a Security Report ticket in {channel:open_a_ticket}.
          **6. No impersonation** of staff, moderators or other players.
          **7. Applications and promotions** go through {channel:open_a_ticket}. Don't DM staff for ranks.
          **8. Spoilers.** Anything found in game goes in {channel:theories}.
          **9. No sale of ranks.** Ranks, roles, approvals and access are never sold or traded.
          **10. Mods have the final say.** Disagree with an action? Open an Appeal ticket in {channel:open_a_ticket}.
        footer: Discretion. Delivery. Duty.
